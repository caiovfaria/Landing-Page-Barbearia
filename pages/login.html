<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Norte Barbearia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--paper);padding:20px;">

    <div class="modal" style="width:min(430px,100%);padding:32px;box-shadow:var(--shadow-lg);">

        <div style="text-align:center;margin-bottom:24px;">
            <a href="../index.html" class="logo" style="justify-content:center;font-size:28px;">
                <i class="mark"></i>NORTE
            </a>
        </div>

        <span class="eyebrow" style="display:block;text-align:center;">Área do cliente</span>
        <h3 style="text-align:center;font-size:32px;margin:8px 0 4px;">Bem-vindo de volta.</h3>
        <p style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px;">
            Entre para acompanhar seus agendamentos e pedidos.
        </p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="loginName">Nome</label>
                <input id="loginName" type="text" required placeholder="Seu nome">
            </div>
            <div class="field">
                <label for="loginEmail">E-mail</label>
                <input id="loginEmail" type="email" required placeholder="voce@email.com">
            </div>
            <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:8px;">
                Entrar na Norte <i data-lucide="arrow-right" size="16"></i>
            </button>
        </form>

        <div class="success" id="loginSuccess">
            <i data-lucide="circle-check-big" color="#c96036" size="56"></i>
            <h3 style="margin:12px 0 4px;">Você está dentro!</h3>
            <p id="welcome" style="color:var(--muted);font-size:14px;"></p>
            <a href="../index.html" class="btn" style="margin-top:16px;justify-content:center;">
                Ir para a página inicial <i data-lucide="arrow-right" size="16"></i>
            </a>
        </div>

        <div id="alreadyLoggedIn" style="display:none;text-align:center;padding:20px 0;">
            <i data-lucide="user-check" color="#c96036" size="56"></i>
            <h3 style="margin:12px 0 4px;">Você já está logado!</h3>
            <p id="loggedInUser" style="color:var(--muted);font-size:14px;"></p>
            <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
                <a href="../index.html" class="btn">Página inicial</a>
                <button class="btn ghost" id="logoutBtn">Sair da conta</button>
            </div>
        </div>

        <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
            <a href="../index.html" style="color:var(--muted);font-size:13px;display:inline-block;margin:0 8px;">←
                Voltar para o site</a>
            <span style="color:var(--line);">|</span>
            <a href="agendamento.html"
                style="color:var(--muted);font-size:13px;display:inline-block;margin:0 8px;">Agendar horário</a>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <script src="../js/script.js"></script>

    <script>
        (function () {
            try {
                const user = JSON.parse(localStorage.getItem('norteUser') || 'null');
                if (user) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('loginSuccess').style.display = 'none';
                    document.getElementById('alreadyLoggedIn').style.display = 'block';
                    document.getElementById('loggedInUser').textContent = 'Olá, ' + user.name + '! (' + user.email + ')';
                }
            } catch (e) { }

            document.getElementById('logoutBtn')?.addEventListener('click', function () {
                localStorage.removeItem('norteUser');
                window.location.reload();
            });
        })();
    </script>

</body>

</html>
